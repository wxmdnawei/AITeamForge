<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Matchmaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8",
    "peerjs": "https://esm.sh/peerjs@1.5.2",
    "buffer": "https://esm.sh/buffer@6.0.3",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1"
  }
}
</script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              theme: {
                dark: '#0A0A0B',
                card: '#18181B',
                primary: 'rgb(var(--theme-primary) / <alpha-value>)',
                secondary: 'rgb(var(--theme-secondary) / <alpha-value>)',
                accent: 'rgb(var(--theme-accent) / <alpha-value>)'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    
    <style>
      :root {
        /* Default (Indigo/Blue) */
        --theme-primary: 99 102 241; /* Indigo-500 */
        --theme-secondary: 6 182 212; /* Cyan-500 */
        --theme-accent: 244 114 182; /* Pink-400 */
      }
      
      [data-theme='cyberpunk'] {
        --theme-primary: 250 204 21; /* Yellow-400 */
        --theme-secondary: 34 211 238; /* Cyan-400 */
        --theme-accent: 251 113 133; /* Rose-400 */
      }

      [data-theme='ocean'] {
        --theme-primary: 14 165 233; /* Sky-500 */
        --theme-secondary: 20 184 166; /* Teal-500 */
        --theme-accent: 99 102 241; /* Indigo-500 */
      }

      [data-theme='forest'] {
        --theme-primary: 16 185 129; /* Emerald-500 */
        --theme-secondary: 132 204 22; /* Lime-500 */
        --theme-accent: 234 179 8;  /* Yellow-500 */
      }

      [data-theme='sunset'] {
        --theme-primary: 249 115 22; /* Orange-500 */
        --theme-secondary: 239 68 68; /* Red-500 */
        --theme-accent: 245 158 11; /* Amber-500 */
      }

      body {
        background-color: #050505;
        color: #ffffff;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
    </style>

    <!-- CRITICAL POLYFILLS (Synchronous) -->
    <script>
      // 1. Global Polyfill (Must run immediately for PeerJS/Util)
      window.global = window;
      window.globalThis = window;
      
      // 2. Process Polyfill
      window.process = {
        env: { NODE_ENV: 'production' },
        nextTick: function(cb) { setTimeout(cb, 0); },
        browser: true,
        version: 'v16.0.0'
      };
      
      console.log("Sync Polyfills initialized");
    </script>

    <!-- CRITICAL POLYFILLS (Module/Buffer) -->
    <script type="module">
      import { Buffer } from 'buffer';
      
      // 3. Buffer Polyfill
      window.Buffer = Buffer;
      
      console.log("Buffer Polyfill initialized");
    </script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
